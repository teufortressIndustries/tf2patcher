name: AppImage Build

on:
  push:
    branches: [ "current" ]
  pull_request:
    branches: [ "current" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse2

    - name: Set up Build Cache
      id: cache-linuxdeploy
      uses: actions/cache@v4
      with:
        path: linuxdeploy-x86_64.AppImage
        key: ${{ runner.os }}-linuxdeploy-v1

    - name: Download LinuxDeploy
      if: steps.cache-linuxdeploy.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

    - name: Build
      run: make TARGET=64

    - name: Create AppImage
      run: |
        export ARCH=x86_64
        export VERSION=$(git rev-parse --short HEAD || echo "dev")
        
        ./linuxdeploy-x86_64.AppImage --appdir AppDir \
          -e bin/tf2patcher \
          -i tf2patcher.png \
          -d tf2patcher.desktop \
          --output appimage

        mv tf2patcher*.AppImage tf2patcher.AppImage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tf2patcher-latest
        path: tf2patcher.AppImage
        retention-days: 7

    - name: Continuous Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/current'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: continuous
        name: "Latest Continuous Build"
        note: "Automated build from branch `current`. Commit: ${{ github.sha }}"
        prerelease: true
        files: tf2patcher.AppImage
        make_latest: true
