name: AppImage Build

on:
  push:
    branches: [ "current" ]
  pull_request:
    branches: [ "current" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          linuxdeploy-x86_64.AppImage
        key: ${{ runner.os }}-build-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfuse2 wget

    - name: Build
      run: make TARGET=64

    - name: Download LinuxDeploy
      run: |
        if [ ! -f linuxdeploy-x86_64.AppImage ]; then
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
        fi

    - name: Create AppImage
      run: |
        mkdir -p AppDir/usr/bin
        cp bin/tf2patcher AppDir/usr/bin/
        # Copy these so linuxdeploy finds them easily
        cp tf2patcher.png AppDir/
        cp tf2patcher.desktop AppDir/
        
        export ARCH=x86_64
        export VERSION=$(git rev-parse --short HEAD)
        
        ./linuxdeploy-x86_64.AppImage --appdir AppDir \
          -e AppDir/usr/bin/tf2patcher \
          -i AppDir/tf2patcher.png \
          -d AppDir/tf2patcher.desktop \
          --output appimage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tf2patcher-latest
        path: "tf2patcher*.AppImage"
        retention-days: 30

    - name: Continuous Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/current'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: continuous
        name: "Latest Continuous Build"
        body: |
          Last updated on commit ${{ github.sha }}.
          This release is automatically updated on every push to the current branch.
        prerelease: true
        files: "tf2patcher*.AppImage"
        make_latest: true
